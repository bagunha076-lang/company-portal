<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#004C98"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <title>테크젠 챗봇 - 모아</title>
  <link rel="stylesheet" href="css/sub-navy.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/common-sub.css"/>
  <link rel="stylesheet" href="css/hr-common.css"/>
  <link rel="stylesheet" href="css/chatbot.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
</head>
<body>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a href="app-home.html" class="logo">
        <img src="images/teczen-logo.png" alt="TECZEN" class="logo-img"/>
        <span class="logo-text">모아</span>
      </a>
      <div class="header-right" id="headerRight">
        <button class="btn-user" id="headerUserBtn">
          <i class="fa-solid fa-circle-user"></i>
          <span id="headerUserName">로딩중...</span>
        </button>
      </div>
    </div>
  </header>

  <section class="sub-hero hr-light">
    <div class="sub-hero-inner">
      <div class="sub-breadcrumb"><a href="app-home.html">메뉴</a><i class="fa-solid fa-chevron-right"></i><span>테크젠 챗봇</span></div>
      <div class="sub-hero-tag"><i class="fa-solid fa-robot"></i> 테크젠 챗봇</div>
      <h1>궁금한 사내 복지제도를 물어보세요</h1>
      <p>복지가이드북 기반으로 자주 묻는 질문에 바로 답해드립니다.</p>
    </div>
  </section>

  <main>
    <div class="page-body">
      <div class="chat-page-card reveal">
        <div class="moa-chat-header">
          <div class="moa-chat-header-info">
            <div class="moa-chat-avatar"><i class="fa-solid fa-robot"></i></div>
            <div>
              <div class="moa-chat-title">모아 복지도우미</div>
              <div class="moa-chat-status"><span class="moa-dot"></span> 온라인</div>
            </div>
          </div>
        </div>
        <div class="moa-chat-body" id="moaChatBody"></div>
        <div class="moa-chat-quick" id="moaChatQuick"></div>
        <form class="moa-chat-input" id="moaChatForm">
          <input type="text" id="moaChatInput" placeholder="궁금한 내용을 입력하세요..." autocomplete="off"/>
          <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-top">
      <div class="footer-brand">
        <img src="images/teczen-logo.png" alt="TECZEN"/>
        <div class="footer-tagline">글로벌 모빌리티 부품 전문기업</div>
        <p class="footer-desc">모아는 테크젠 임직원을 위한 통합 총무 서비스 포털입니다.</p>
      </div>
      <div class="footer-quick">
        <div class="footer-col-title">빠른 메뉴</div>
        <div class="footer-links">
          <a href="app-home.html"><i class="fa-solid fa-angle-right"></i> 전체 메뉴</a>
          <a href="welfare.html"><i class="fa-solid fa-angle-right"></i> 복지포인트 조회</a>
        </div>
      </div>
      <div class="footer-contact-col">
        <div class="footer-col-title">CONTACT</div>
        <div class="footer-contact">
          <div class="footer-contact-item">
            <div class="footer-contact-icon"><i class="fa-solid fa-envelope"></i></div>
            <div><div class="footer-contact-label">Email</div><div class="footer-contact-value">moa@teczen.co.kr</div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <div class="footer-copy">&copy; 2026 TECZEN Corp. All rights reserved.</div>
    </div>
  </footer>

  <script src="js/sub-common.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
